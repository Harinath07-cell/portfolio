<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="Inter,Arial,sans-serif">
<rect width="1240" height="560" fill="#0C0E16"/>
<text x="36" y="46" fill="#F5F6FA" font-size="24" font-weight="700">Task 1 — Circuit &amp; Pin Connections</text>
<text x="36" y="72" fill="#33E6C9" font-size="14" font-family="monospace">Hardware: ESP32 + on-board LED (GPIO 2)</text>
<rect x="60" y="100" width="230" height="330" rx="14" fill="#12141F" stroke="#33E6C9" stroke-width="2.5"/><text x="175" y="132" text-anchor="middle" fill="#F5F6FA" font-size="18" font-weight="700">ESP32 Dev Board</text><text x="175" y="152" text-anchor="middle" fill="#9AA1B4" font-size="12">ESP-WROOM-32</text><text x="272" y="220" text-anchor="end" fill="#8B7CFF" font-size="14" font-weight="700" font-family="monospace">GPIO 2</text><line x1="290" y1="215" x2="560" y2="215" stroke="#8B7CFF" stroke-width="3"/><circle cx="290" cy="215" r="4.5" fill="#8B7CFF"/><circle cx="560" cy="215" r="4.5" fill="#8B7CFF"/><text x="304" y="206" fill="#8B7CFF" font-size="12" font-family="monospace">GPIO 2 (digital output)</text><rect x="560" y="185" width="250" height="60" rx="12" fill="#12141F" stroke="#8B7CFF" stroke-width="2"/><text x="685.0" y="212.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">On-board LED</text><text x="685.0" y="230.0" text-anchor="middle" fill="#9AA1B4" font-size="11">wired to GPIO 2 on the board</text><text x="272" y="315" text-anchor="end" fill="#9AA1B4" font-size="14" font-weight="700" font-family="monospace">GND</text><line x1="290" y1="310" x2="560" y2="310" stroke="#9AA1B4" stroke-width="3"/><circle cx="290" cy="310" r="4.5" fill="#9AA1B4"/><circle cx="560" cy="310" r="4.5" fill="#9AA1B4"/><text x="304" y="301" fill="#9AA1B4" font-size="12" font-family="monospace">GND (common ground)</text><rect x="560" y="280" width="250" height="60" rx="12" fill="#12141F" stroke="#9AA1B4" stroke-width="2"/><text x="685.0" y="307.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Ground reference</text><text x="685.0" y="325.0" text-anchor="middle" fill="#9AA1B4" font-size="11">LED return path</text><text x="272" y="410" text-anchor="end" fill="#FFB56B" font-size="14" font-weight="700" font-family="monospace">USB 5V</text><line x1="290" y1="405" x2="560" y2="405" stroke="#FFB56B" stroke-width="3"/><circle cx="290" cy="405" r="4.5" fill="#FFB56B"/><circle cx="560" cy="405" r="4.5" fill="#FFB56B"/><text x="304" y="396" fill="#FFB56B" font-size="12" font-family="monospace">Micro-USB 5 V + serial</text><rect x="560" y="375" width="250" height="60" rx="12" fill="#12141F" stroke="#FFB56B" stroke-width="2"/><text x="685.0" y="402.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Laptop / USB supply</text><text x="685.0" y="420.0" text-anchor="middle" fill="#9AA1B4" font-size="11">power, upload, Serial Monitor @115200</text><text x="900" y="155" fill="#9AA1B4" font-size="13">Optional bulb demonstration (lab photos)</text><path d="M810 215 L860 215 L860 225 L900 225" fill="none" stroke="#8B7CFF" stroke-width="3" stroke-dasharray="7 5"/><rect x="900" y="195" width="290" height="60" rx="12" fill="#12141F" stroke="#FF6E6E" stroke-width="2" stroke-dasharray="6 5"/><text x="1045.0" y="222.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Relay module</text><text x="1045.0" y="240.0" text-anchor="middle" fill="#9AA1B4" font-size="11">IN ← GPIO 2 (same pin)</text><path d="M1045 255 L1045 305" stroke="#FF6E6E" stroke-width="3" stroke-dasharray="7 5"/><rect x="900" y="305" width="290" height="60" rx="12" fill="#12141F" stroke="#FFB56B" stroke-width="2" stroke-dasharray="6 5"/><text x="1045.0" y="332.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Bulb (mains load)</text><text x="1045.0" y="350.0" text-anchor="middle" fill="#9AA1B4" font-size="11">via relay COM / NO</text>
<text x="36" y="502" fill="#9AA1B4" font-size="13">Network path (no wires): ESP32 Wi-Fi → router → browser (HTTP, port 80)</text>
<text x="36" y="532" fill="#FFB56B" font-size="13">Safety: never connect mains directly to the ESP32 — use an isolated relay module and insulated wiring.</text>
</svg>