<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Inter,Arial,sans-serif">
<rect width="1240" height="640" fill="#0C0E16"/>
<text x="36" y="46" fill="#F5F6FA" font-size="24" font-weight="700">Task 4 — Circuit &amp; Pin Connections</text>
<text x="36" y="72" fill="#33E6C9" font-size="14" font-family="monospace">ESP32 + DHT11 + LDR (10 kΩ divider) + relay module + bulb</text>
<rect x="60" y="100" width="230" height="470" rx="14" fill="#12141F" stroke="#33E6C9" stroke-width="2.5"/><text x="175" y="132" text-anchor="middle" fill="#F5F6FA" font-size="18" font-weight="700">ESP32 Dev Board</text><text x="175" y="152" text-anchor="middle" fill="#9AA1B4" font-size="12">ESP-WROOM-32</text><text x="272" y="215" text-anchor="end" fill="#FF6E6E" font-size="14" font-weight="700" font-family="monospace">3V3</text><line x1="290" y1="210" x2="640" y2="210" stroke="#FF6E6E" stroke-width="3"/><circle cx="290" cy="210" r="4.5" fill="#FF6E6E"/><circle cx="640" cy="210" r="4.5" fill="#FF6E6E"/><text x="304" y="201" fill="#FF6E6E" font-size="12" font-family="monospace">3.3V → DHT11 VCC and LDR top leg</text><rect x="640" y="184" width="210" height="52" rx="12" fill="#12141F" stroke="#FF6E6E" stroke-width="2"/><text x="745.0" y="215.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">DHT11 VCC</text><text x="272" y="277" text-anchor="end" fill="#8B7CFF" font-size="14" font-weight="700" font-family="monospace">GPIO 4</text><line x1="290" y1="272" x2="640" y2="272" stroke="#8B7CFF" stroke-width="3"/><circle cx="290" cy="272" r="4.5" fill="#8B7CFF"/><circle cx="640" cy="272" r="4.5" fill="#8B7CFF"/><text x="304" y="263" fill="#8B7CFF" font-size="12" font-family="monospace">GPIO 4 ← DHT11 DATA</text><rect x="640" y="246" width="210" height="52" rx="12" fill="#12141F" stroke="#8B7CFF" stroke-width="2"/><text x="745.0" y="269.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">DHT11 DATA</text><text x="745.0" y="287.0" text-anchor="middle" fill="#9AA1B4" font-size="11">temperature + humidity</text><text x="272" y="339" text-anchor="end" fill="#33E6C9" font-size="14" font-weight="700" font-family="monospace">GPIO 34</text><line x1="290" y1="334" x2="640" y2="334" stroke="#33E6C9" stroke-width="3"/><circle cx="290" cy="334" r="4.5" fill="#33E6C9"/><circle cx="640" cy="334" r="4.5" fill="#33E6C9"/><text x="304" y="325" fill="#33E6C9" font-size="12" font-family="monospace">GPIO 34 (ADC) ← LDR / 10k node</text><rect x="640" y="308" width="210" height="52" rx="12" fill="#12141F" stroke="#33E6C9" stroke-width="2"/><text x="745.0" y="331.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">LDR divider tap</text><text x="745.0" y="349.0" text-anchor="middle" fill="#9AA1B4" font-size="11">LDR to 3V3, 10 kΩ to GND</text><text x="272" y="401" text-anchor="end" fill="#FFB56B" font-size="14" font-weight="700" font-family="monospace">GPIO 23</text><line x1="290" y1="396" x2="640" y2="396" stroke="#FFB56B" stroke-width="3"/><circle cx="290" cy="396" r="4.5" fill="#FFB56B"/><circle cx="640" cy="396" r="4.5" fill="#FFB56B"/><text x="304" y="387" fill="#FFB56B" font-size="12" font-family="monospace">GPIO 23 → relay IN</text><rect x="640" y="370" width="210" height="52" rx="12" fill="#12141F" stroke="#FFB56B" stroke-width="2"/><text x="745.0" y="393.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Relay IN</text><text x="745.0" y="411.0" text-anchor="middle" fill="#9AA1B4" font-size="11">1-channel relay module</text><text x="272" y="463" text-anchor="end" fill="#FF6E6E" font-size="14" font-weight="700" font-family="monospace">VIN / 5V</text><line x1="290" y1="458" x2="640" y2="458" stroke="#FF6E6E" stroke-width="3"/><circle cx="290" cy="458" r="4.5" fill="#FF6E6E"/><circle cx="640" cy="458" r="4.5" fill="#FF6E6E"/><text x="304" y="449" fill="#FF6E6E" font-size="12" font-family="monospace">VIN 5V → relay VCC</text><rect x="640" y="432" width="210" height="52" rx="12" fill="#12141F" stroke="#FF6E6E" stroke-width="2"/><text x="745.0" y="463.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Relay VCC</text><text x="272" y="525" text-anchor="end" fill="#9AA1B4" font-size="14" font-weight="700" font-family="monospace">GND</text><line x1="290" y1="520" x2="640" y2="520" stroke="#9AA1B4" stroke-width="3"/><circle cx="290" cy="520" r="4.5" fill="#9AA1B4"/><circle cx="640" cy="520" r="4.5" fill="#9AA1B4"/><text x="304" y="511" fill="#9AA1B4" font-size="12" font-family="monospace">GND common (DHT11, 10k, relay)</text><rect x="640" y="494" width="210" height="52" rx="12" fill="#12141F" stroke="#9AA1B4" stroke-width="2"/><text x="745.0" y="525.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Common GND</text><rect x="930" y="276" width="260" height="56" rx="12" fill="#12141F" stroke="#FFB56B" stroke-width="2"/><text x="1060.0" y="301.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Relay COM / NO</text><text x="1060.0" y="319.0" text-anchor="middle" fill="#9AA1B4" font-size="11">switches the bulb live wire</text><rect x="930" y="366" width="260" height="56" rx="12" fill="#12141F" stroke="#FFB56B" stroke-width="2"/><text x="1060.0" y="391.0" text-anchor="middle" fill="#F5F6FA" font-size="15" font-weight="700">Bulb (mains load)</text><text x="1060.0" y="409.0" text-anchor="middle" fill="#9AA1B4" font-size="11">neutral direct to supply</text><path d="M850 396 L890 396 L890 304 L930 304" fill="none" stroke="#FFB56B" stroke-width="3"/><path d="M1060 332 L1060 366" stroke="#FFB56B" stroke-width="3"/>
<text x="36" y="614" fill="#FFB56B" font-size="13">Pins follow the firmware: DHT_PIN 4, LDR_PIN 34, RELAY_PIN 23. Mains wiring is high voltage — use an isolated relay and an enclosure.</text>
</svg>