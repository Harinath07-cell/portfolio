<!DOCTYPE html>
<html>
<head>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>ESP32 Web Server LED Control</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #0f172a; color: #f8fafc; padding-top: 50px; }
    h1 { color: #38bdf8; margin-bottom: 30px; }
    .btn { display: inline-block; padding: 15px 32px; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 12px; margin: 10px; transition: 0.3s; }
    .btn-on { background-color: #00E5FF; color: #0f172a; }
    .btn-off { background-color: #ef4444; color: #ffffff; }
    .btn:hover { opacity: 0.85; transform: scale(1.05); }
  </style>
</head>
<body>
  <h1>ESP32 Web Server LED Control</h1>
  <p>Control hardware GPIO 2 directly over Wi-Fi</p>
  <p><a href='/led/on' class='btn btn-on'>TURN LED ON</a></p>
  <p><a href='/led/off' class='btn btn-off'>TURN LED OFF</a></p>
</body>
</html>
